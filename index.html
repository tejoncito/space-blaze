<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Space Blaze</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600&family=Press+Start+2P&display=swap">
<style>
:root{--void:#0b0620;--deck:#160c35;--line:#3a2a7a;--cyan:#3de8ff;--mag:#ff3dbe;--leaf:#8dff5a;--text:#ece6ff;--muted:#a79cd0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:16px;background:radial-gradient(ellipse at 20% 20%,rgba(255,61,190,.18),transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(61,232,255,.14),transparent 50%),var(--void)}
form{width:min(420px,100%);background:var(--deck);border:2px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 40px rgba(255,61,190,.25)}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:52px;line-height:.95;margin:0;color:#fff;text-shadow:0 0 18px rgba(255,61,190,.8)}
h1 span{color:var(--cyan);text-shadow:0 0 18px rgba(61,232,255,.8)}
label{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--muted)}
input[type=password]{font:15px "Press Start 2P",monospace;padding:14px;background:var(--void);color:var(--leaf);border:2px solid var(--leaf);min-width:0;width:100%}
label.check{display:flex;gap:8px;align-items:center;font-family:"Chakra Petch",system-ui,sans-serif;font-size:15px;color:var(--muted)}
button{font:13px "Press Start 2P",monospace;padding:16px;background:var(--mag);color:#fff;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid #ffb23d;outline-offset:2px}
#msg{margin:0;min-height:1.4em;color:var(--mag);font-weight:600}
</style>
</head>

<script>
(function () {
  var KEY = 'spaceblaze-pw';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('f'), input = document.getElementById('pw'), btn = document.getElementById('go'), msg = document.getElementById('msg');
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function concat(a, b) { var u = new Uint8Array(a.length + b.length); u.set(a, 0); u.set(b, a.length); return u; }
  function unlock(pw, remember) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) return Promise.reject(new Error('Dieser Browser kann nicht entschlüsseln. Bitte Chrome, Firefox oder Edge nutzen.'));
    var salt = b64(P.salt), iv = b64(P.iv), ct = b64(P.ct), mac = b64(P.mac);
    return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: P.iter }, base, 512); })
      .then(function (bits) {
        bits = new Uint8Array(bits);
        return Promise.all([
          subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']),
          subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify'])
        ]);
      })
      .then(function (keys) {
        return subtle.verify('HMAC', keys[1], mac, concat(iv, ct)).then(function (ok) {
          if (!ok) throw new Error('Falsches Passwort.');
          return subtle.decrypt({ name: 'AES-CBC', iv: iv }, keys[0], ct);
        });
      })
      .then(function (plain) {
        try { if (remember) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY); } catch (e) {}
        var html = new TextDecoder().decode(plain);
        document.open(); document.write(html); document.close();
      });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; msg.textContent = 'Entschlüssele …';
    unlock(input.value, document.getElementById('remember').checked).catch(function (err) {
      btn.disabled = false; msg.textContent = err.message || String(err);
      try { localStorage.removeItem(KEY); } catch (e) {}
      input.select();
    });
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { btn.disabled = true; msg.textContent = 'Entschlüssele …'; unlock(saved, true).catch(function () { btn.disabled = false; msg.textContent = ''; }); }
  else input.focus();
})();
